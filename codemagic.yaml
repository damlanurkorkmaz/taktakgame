# Codemagic: Tak Tak! iOS derleme ve App Store Connect'e yükleme
#
# Kullanmadan önce:
# 1. Codemagic > Team settings > Team integrations > Developer Portal'a App Store Connect API anahtarını ekle.
#    Anahtarın Codemagic'teki adını aşağıdaki `app_store_connect:` satırına yaz.
# 2. Apple Developer hesabında bundle ID'yi (com.damlanur.taktakgame) kaydet,
#    App Store Connect'te uygulama kaydını oluştur.
# 3. App Store Connect > Uygulama > Genel Bilgiler'deki "Apple ID" numarasını APP_STORE_APPLE_ID'ye yaz.
# 4. Codemagic > Code signing identities'e bir "Apple Distribution" sertifikası ekle
#    (ya da Codemagic'e oluşturt). Profil, aşağıdaki ios_signing ile otomatik alınır.

workflows:
  ios-app-store:
    name: Tak Tak – App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: GunNotuASC   # Codemagic'teki API anahtarının adı
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.damlanur.taktakgame
      vars:
        XCODE_PROJECT: "TakTak.xcodeproj"
        XCODE_SCHEME: "TakTak"
        APP_STORE_APPLE_ID: 6837406855      # App Store Connect'teki Apple ID ile değiştir
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Kod imzalama ayarlarını projeye uygula
        script: xcode-project use-profiles
      - name: Build numarasını artır
        script: |
          cd $CM_BUILD_DIR
          # Hem TestFlight'taki hem App Store'daki son build numarasına bak, büyük olanın bir fazlasını kullan.
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -dc '0-9')
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -dc '0-9')
          TF=${TF:-0}
          AS=${AS:-0}
          LATEST=$(( TF > AS ? TF : AS ))
          NEW=$(( LATEST + 1 ))
          echo "TestFlight: $TF, App Store: $AS, yeni build numarası: $NEW"
          agvtool new-version -all $NEW
      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # İlk sürümü TestFlight'ta deneyip mağazaya elle gönder
